version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: blockxone
      POSTGRES_PASSWORD: blockxone
      POSTGRES_DB: blockxone
    ports:
      - "5432:5432"
    volumes:
      - bx1_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  nats:
    image: nats:2.10
    ports:
      - "4222:4222"
      - "8222:8222"

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - bx1_minio:/data

  # one-shot bucket init
  minio-init:
    image: minio/mc:RELEASE.2024-01-11T05-49-32Z
    depends_on:
      - minio
    entrypoint: ["/bin/sh","-c"]
    command: >
      "mc alias set bx1 http://minio:9000 minioadmin minioadmin &&
       mc mb -p bx1/blockxone-kyc || true &&
       mc anonymous set download bx1/blockxone-kyc || true"

volumes:
  bx1_pg:
  bx1_minio:
