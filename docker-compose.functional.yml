name: blockxone-functional

x-app-environment: &app-environment
  APP_ENV: dev
  AUTH_MODE: dev
  DEV_ALLOW_ROLE_OVERRIDE: "false"
  JWT_SECRET: local-functional-stack-secret
  DATABASE_URL: postgres://blockxone:blockxone@postgres:5432/blockxone?sslmode=disable
  NATS_URL: nats://nats:4222
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET: blockxone-kyc
  S3_REGION: us-east-1
  S3_USE_SSL: "false"
  CHAIN_MODE: mock
  ENABLE_MARKETPLACE: "true"
  CORS_ALLOWED_ORIGINS: http://localhost:${BX1_WEB_PORT:-13000},http://127.0.0.1:${BX1_WEB_PORT:-13000}

x-api-image: &api-image blockxone-functional-api:local

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: blockxone
      POSTGRES_PASSWORD: blockxone
      POSTGRES_DB: blockxone
    ports:
      - "127.0.0.1:${BX1_POSTGRES_PORT:-15432}:5432"
    volumes:
      - functional_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockxone -d blockxone"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:${BX1_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2.10
    ports:
      - "127.0.0.1:${BX1_NATS_PORT:-14222}:4222"
      - "127.0.0.1:${BX1_NATS_MONITOR_PORT:-18222}:8222"

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:${BX1_MINIO_PORT:-19000}:9000"
      - "127.0.0.1:${BX1_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - functional_minio:/data

  minio-init:
    image: minio/mc:RELEASE.2024-01-11T05-49-32Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set bx1 http://minio:9000 minioadmin minioadmin; do sleep 1; done;
        mc mb -p bx1/blockxone-kyc || true
    restart: "no"

  migrate:
    image: *api-image
    pull_policy: never
    entrypoint: ["/home/appuser/migrate"]
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    image: *api-image
    pull_policy: never
    entrypoint: ["/home/appuser/seed"]
    network_mode: "service:postgres"
    environment:
      <<: *app-environment
      ALLOW_DEV_SEED: "true"
      DATABASE_URL: postgres://blockxone:blockxone@127.0.0.1:5432/blockxone?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    image: *api-image
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      <<: *app-environment
      HTTP_ADDR: 0.0.0.0:8080
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BX1_API_PORT:-18080}:8080"

  worker:
    image: blockxone-functional-worker:local
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      <<: *app-environment
    depends_on:
      seed:
        condition: service_completed_successfully
      nats:
        condition: service_started

  web:
    image: blockxone-functional-web:local
    build:
      context: .
      dockerfile: Dockerfile.web.functional
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:${BX1_API_PORT:-18080}
      BLOCKXONE_API_INTERNAL_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BX1_WEB_PORT:-13000}:3000"

volumes:
  functional_pg:
  functional_minio:
