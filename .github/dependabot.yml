version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "codex/functional-platform"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    target-branch: "codex/functional-platform"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/contracts"
    schedule:
      interval: "weekly"
    target-branch: "codex/functional-platform"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "codex/functional-platform"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "codex/functional-platform"
    open-pull-requests-limit: 5
