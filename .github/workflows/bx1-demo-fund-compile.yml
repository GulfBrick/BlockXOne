            'src/lib/portal/fund-recipient-allocation-schema.test.ts',
            'src/lib/portal/fund-roleplay-manager-bridge-schema.test.ts',
            'src/components/portal/fund-recipient-compliance-queue.test.tsx',
          ]
          process.exitCode = await runHermeticVitest({
            spawnImplementation: (executable, args, options) => spawn(executable, [...args, ...files], options),
          })
          NODE

      - name: Check only recovery transport and protected workflow guards without an engine or secrets
        if: ${{ inputs.mode == 'document-result-recovery-focused' }}
        run: node --test apps/web/scripts/document-scanner-runner.node-test.mjs apps/web/scripts/document-scanner-offering-operating.node-test.mjs

      - name: Typecheck the same reviewed source before requesting its release build
        if: ${{ (inputs.mode == 'fund-dashboard-focused' || inputs.mode == 'auth-recovery-focused' || inputs.mode == 'connected-session-focused' || inputs.mode == 'document-read-recovery-focused' || inputs.mode == 'fund-signer-entry-focused' || inputs.mode == 'connected-fund-providers-focused' || inputs.mode == 'offering-signatures-api-focused' || inputs.mode == 'provider-diagnostics-focused' || inputs.mode == 'document-result-recovery-focused') && !cancelled() }}
        shell: bash
        working-directory: apps/web
        run: npx tsc --noEmit --incremental false
