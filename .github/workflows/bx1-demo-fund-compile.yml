permissions:
  contents: read

jobs:
  document-scanner-engine:
    name: Real scanner engine and bounded producer
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'acceptance' || inputs.mode == 'connected-fund-providers-focused' || inputs.mode == 'official-scanner-focused' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact scanner source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Select pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          check-latest: false
          package-manager-cache: false
      - name: Install cryptographically pinned official ClamAV in disposable cloud runner
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 180 \
            'https://github.com/Cisco-Talos/clamav/releases/download/clamav-1.4.6/clamav-1.4.6.linux.x86_64.deb' \
            --output "$RUNNER_TEMP/bx1-clamav-1.4.6.deb"
          printf '%s  %s\n' 'd3ee9e401974855a1edc1761b1425417d126de618d5f0c91cd51209f69f6fcc2' "$RUNNER_TEMP/bx1-clamav-1.4.6.deb" | sha256sum --check --strict
          sudo dpkg --install "$RUNNER_TEMP/bx1-clamav-1.4.6.deb"
          test -x /usr/local/bin/clamscan
          printf '%s  %s\n' '08160a5c11103e1a7af3b783b25e947a52bb0a598c40102c7aaa6525e477f7bf' '/usr/local/bin/clamscan' | sha256sum --check --strict
          /usr/local/bin/clamscan --version
      - name: Prove producer protocol negatives without real customer data
        shell: bash
        run: node --test apps/web/scripts/document-scanner-runner.node-test.mjs apps/web/scripts/document-scanner-snapshot.node-test.mjs apps/web/scripts/document-scanner-offering-operating.node-test.mjs
      - name: Prove real benign and detection-fixture scans
        shell: bash
        env:
          BX1_SCANNER_CLOUD_PROOF: github-clamav-1.4.6
          BX1_SCANNER_CLOUD_ENGINE: /usr/local/bin/clamscan
          BX1_SCANNER_PACKAGE_SHA256: d3ee9e401974855a1edc1761b1425417d126de618d5f0c91cd51209f69f6fcc2
        run: node apps/web/scripts/document-scanner-engine-proof.mjs
      - name: Verify current official signature set without accessing any private queue
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'connected-fund-providers-focused' || inputs.mode == 'official-scanner-focused') }}
        shell: bash
        env:
          BX1_SCANNER_OFFICIAL_CLOUD_PROOF: github-clamav-official-1.4.6
          BX1_SCANNER_PACKAGE_SHA256: d3ee9e401974855a1edc1761b1425417d126de618d5f0c91cd51209f69f6fcc2
        run: node apps/web/scripts/document-scanner-official-proof.mjs
  offering-scanner-source-focused:
    name: Focused offering worker source acceptance
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'offering-scanner-source-focused' || inputs.mode == 'offering-signatures-api-focused') && github.repository == 'GulfBrick/BlockXOne' && github.ref == 'refs/heads/codex/stage2-sandbox-completion-20261011' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out reviewed worker source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Select pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          check-latest: false
          package-manager-cache: false
      - name: Verify only the new operating boundary without secrets or queue access
        run: node --test apps/web/scripts/document-scanner-offering-operating.node-test.mjs
  offering-document-scanner-operating:
    name: Manual protected TEST offering document worker
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'offering-scanner-operating' && github.repository == 'GulfBrick/BlockXOne' && github.ref == 'refs/heads/codex/stage2-sandbox-completion-20261011' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: bx1-test-offering-scanner
    concurrency:
      group: bx1-test-offering-scanner
      cancel-in-progress: false
    env:
      BX1_SCANNER_SCOPE: ${{ inputs.scanner_scope }}
      BX1_SCANNER_OPERATION: ${{ inputs.scanner_operation }}
      BX1_SCANNER_APPROVED_SOURCE_COMMIT: ${{ vars.BX1_SCANNER_APPROVED_SOURCE_COMMIT }}
      BX1_SCANNER_OPERATING_CLOUD_RUN: test-offering-scanner-v1
      BX1_SCANNER_PACKAGE_SHA256: d3ee9e401974855a1edc1761b1425417d126de618d5f0c91cd51209f69f6fcc2
      BX1_SCANNER_PROJECT_REF: fegnnnlseuejkrusbbkv
      BLOCKXONE_ENVIRONMENT: TESTNET
      BLOCKXONE_APP_ORIGIN: https://testnet.bx1.co.za
      BLOCKXONE_DOCUMENT_PROCESSING_WORKER_ID: bx1-test-offering-document-worker-v1
      BLOCKXONE_DOCUMENT_SCANNER_ID: bx1-test-clamav-1-4-6-official-v1
    steps:
      - name: Check out reviewed operating source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Select pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          check-latest: false
          package-manager-cache: false
      - name: Reject unapproved commit, environment or repeated operating attempt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --input-type=module -e "import { validateOperatingEnvironment } from './apps/web/scripts/document-scanner-offering-operating.mjs'; validateOperatingEnvironment();"
      - name: Install pinned official scanner without any application secret
        if: ${{ inputs.scanner_operation == 'CLAIM' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 180 \
            'https://github.com/Cisco-Talos/clamav/releases/download/clamav-1.4.6/clamav-1.4.6.linux.x86_64.deb' \
            --output "$RUNNER_TEMP/bx1-clamav-1.4.6.deb"
          printf '%s  %s\n' 'd3ee9e401974855a1edc1761b1425417d126de618d5f0c91cd51209f69f6fcc2' "$RUNNER_TEMP/bx1-clamav-1.4.6.deb" | sha256sum --check --strict
          sudo dpkg --install "$RUNNER_TEMP/bx1-clamav-1.4.6.deb"
          test -x /usr/local/bin/clamscan
          printf '%s  %s\n' '08160a5c11103e1a7af3b783b25e947a52bb0a598c40102c7aaa6525e477f7bf' '/usr/local/bin/clamscan' | sha256sum --check --strict
          /usr/local/bin/clamscan --version
      - name: Validate operating boundary without queue access or credentials
        shell: bash
        run: node --test apps/web/scripts/document-scanner-offering-operating.node-test.mjs
      - name: Process one explicitly selected TEST document operation
        shell: bash
        env:
          BLOCKXONE_DOCUMENT_SCANNER_HMAC_KEY: ${{ secrets.BLOCKXONE_DOCUMENT_SCANNER_HMAC_KEY }}
          BX1_SCANNER_RECOVERY_BINDING: ${{ inputs.scanner_operation == 'RECOVER' && secrets.BX1_SCANNER_RECOVERY_BINDING || '' }}
        run: node apps/web/scripts/document-scanner-offering-operating.mjs
  compile-and-build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'acceptance' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        target: [TESTNET, MAINNET]
    services:
      postgres:
        image: docker.io/library/postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_DB: bx1_demo_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: bx1-synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bx1_demo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Select pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          check-latest: false
          package-manager-cache: false

      - name: Install exact Solidity compiler into ephemeral runner path
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.8 --no-audit --no-fund
          test "$(node --version)" = 'v22.23.1'
          test "$(npm --version)" = '10.9.8'
          npm install --prefix "$RUNNER_TEMP/bx1-solc" --ignore-scripts --no-audit --no-fund --save-exact solc@0.8.24
          test -f "$RUNNER_TEMP/bx1-solc/node_modules/solc/index.js"

      - name: Compile exact source and generate ABI and bytecode
        shell: bash
        env:
          BX1_SOLC_ENTRY: ${{ runner.temp }}/bx1-solc/node_modules/solc/index.js
        run: |
          set -euo pipefail
          node contracts/demo/compile.mjs \
            --json-out "$RUNNER_TEMP/bx1-demo-fund/Bx1DemoFund.json" \
            --ts-out apps/web/src/lib/testnet-fund/artifact.generated.ts

      - name: Verify compiler output and exact demo interface without EVM execution
        shell: bash
        env:
          BX1_DEMO_ARTIFACT_JSON: ${{ runner.temp }}/bx1-demo-fund/Bx1DemoFund.json
        run: node --test contracts/demo/Bx1DemoFund.test.mjs

      - name: Publish compiled artifact and generated web module
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bx1-amoy-demo-fund-${{ matrix.target }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/bx1-demo-fund/Bx1DemoFund.json
            apps/web/src/lib/testnet-fund/artifact.generated.ts

      - name: Install locked hosted web dependencies
        shell: bash
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Run the controlled hermetic web suite, including fund admission
        shell: bash
        working-directory: apps/web
        run: npm test

      - name: Verify isolated fund SQL state machine
        shell: bash
        working-directory: apps/web
        env:
          BX1_DEMO_SQL_TEST_URL: postgresql://postgres:bx1-synthetic-ci-only@127.0.0.1:5432/bx1_demo_ci
        run: node scripts/test-testnet-fund.mjs

      - name: Install pinned ClamAV for connected offering-document proof
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 180 \
            'https://github.com/Cisco-Talos/clamav/releases/download/clamav-1.4.6/clamav-1.4.6.linux.x86_64.deb' \
            --output "$RUNNER_TEMP/bx1-clamav-1.4.6.deb"
          printf '%s  %s\n' 'd3ee9e401974855a1edc1761b1425417d126de618d5f0c91cd51209f69f6fcc2' "$RUNNER_TEMP/bx1-clamav-1.4.6.deb" | sha256sum --check --strict
          sudo dpkg --install "$RUNNER_TEMP/bx1-clamav-1.4.6.deb"
          test -x /usr/local/bin/clamscan
          printf '%s  %s\n' '08160a5c11103e1a7af3b783b25e947a52bb0a598c40102c7aaa6525e477f7bf' '/usr/local/bin/clamscan' | sha256sum --check --strict
          /usr/local/bin/clamscan --version

      - name: Verify customer onboarding, offerings and reservations in isolated cloud PostgreSQL
        if: ${{ !cancelled() }}
        shell: bash
        env:
          BX1_PORTAL_SQL_TEST_URL: postgresql://postgres:bx1-synthetic-ci-only@127.0.0.1:5432/bx1_demo_ci
          BX1_PORTAL_PROOF_LINEAGE: ${{ matrix.target == 'TESTNET' && 'FUNDING_LINKED' || 'STOCK' }}
          BX1_SCANNER_CLOUD_PROOF: github-clamav-1.4.6
          BX1_SCANNER_CLOUD_ENGINE: /usr/local/bin/clamscan
          BX1_SCANNER_PACKAGE_SHA256: d3ee9e401974855a1edc1761b1425417d126de618d5f0c91cd51209f69f6fcc2
        run: node apps/web/scripts/test-portal.mjs

      - name: Typecheck and build hosted web with compiled artifact
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: apps/web
        env:
          CI: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
          NODE_ENV: production
          BLOCKXONE_AUTH_MODE: supabase
          NEXT_PUBLIC_BLOCKXONE_AUTH_MODE: supabase
          SUPABASE_URL: ${{ matrix.target == 'TESTNET' && 'https://fegnnnlseuejkrusbbkv.supabase.co' || 'https://oqkevkjbkpugjotihtda.supabase.co' }}
