name: BX1 platform cloud acceptance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Cloud acceptance or one fixed-origin empty-form browser proof
        type: choice
        options: [acceptance, registration-browser-proof]
        default: acceptance
      registration_origin_expectation:
        description: Expected browser-generated Origin on the current hosted TEST document
