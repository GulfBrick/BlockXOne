permissions:
  contents: read

jobs:
  compile-and-build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'registration-browser-proof' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [TESTNET, MAINNET]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bx1_demo_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: bx1-synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bx1_demo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Select pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          check-latest: false
          package-manager-cache: false

      - name: Install exact Solidity compiler into ephemeral runner path
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.8 --no-audit --no-fund
          test "$(node --version)" = 'v22.23.1'
          test "$(npm --version)" = '10.9.8'
          npm install --prefix "$RUNNER_TEMP/bx1-solc" --ignore-scripts --no-audit --no-fund --save-exact solc@0.8.24
          test -f "$RUNNER_TEMP/bx1-solc/node_modules/solc/index.js"

      - name: Compile exact source and generate ABI and bytecode
        shell: bash
        env:
          BX1_SOLC_ENTRY: ${{ runner.temp }}/bx1-solc/node_modules/solc/index.js
        run: |
          set -euo pipefail
          node contracts/demo/compile.mjs \
            --json-out "$RUNNER_TEMP/bx1-demo-fund/Bx1DemoFund.json" \
            --ts-out apps/web/src/lib/testnet-fund/artifact.generated.ts

      - name: Verify compiler output and exact demo interface without EVM execution
        shell: bash
        env:
          BX1_DEMO_ARTIFACT_JSON: ${{ runner.temp }}/bx1-demo-fund/Bx1DemoFund.json
        run: node --test contracts/demo/Bx1DemoFund.test.mjs

      - name: Publish compiled artifact and generated web module
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bx1-amoy-demo-fund-${{ matrix.target }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/bx1-demo-fund/Bx1DemoFund.json
            apps/web/src/lib/testnet-fund/artifact.generated.ts

      - name: Install locked hosted web dependencies
        shell: bash
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Run the controlled hermetic web suite, including fund admission
        shell: bash
        working-directory: apps/web
        run: npm test

      - name: Verify isolated fund SQL state machine
        shell: bash
        working-directory: apps/web
        env:
          BX1_DEMO_SQL_TEST_URL: postgresql://postgres:bx1-synthetic-ci-only@127.0.0.1:5432/bx1_demo_ci
        run: node scripts/test-testnet-fund.mjs

      - name: Verify customer onboarding, offerings and reservations in isolated cloud PostgreSQL
        if: ${{ !cancelled() }}
        shell: bash
        env:
          BX1_PORTAL_SQL_TEST_URL: postgresql://postgres:bx1-synthetic-ci-only@127.0.0.1:5432/bx1_demo_ci
        run: node apps/web/scripts/test-portal.mjs

      - name: Typecheck and build hosted web with compiled artifact
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: apps/web
        env:
          CI: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
          NODE_ENV: production
          BLOCKXONE_AUTH_MODE: supabase
          NEXT_PUBLIC_BLOCKXONE_AUTH_MODE: supabase
          SUPABASE_URL: ${{ matrix.target == 'TESTNET' && 'https://fegnnnlseuejkrusbbkv.supabase.co' || 'https://oqkevkjbkpugjotihtda.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_00000000000000000000000000000000
          BLOCKXONE_APP_ORIGIN: ${{ matrix.target == 'TESTNET' && 'https://testnet.bx1.co.za' || 'https://bx1.co.za' }}
          SERVER_ACTION_ALLOWED_ORIGINS: ${{ matrix.target == 'TESTNET' && 'testnet.bx1.co.za' || 'bx1.co.za' }}
          BLOCKXONE_ENVIRONMENT: ${{ matrix.target }}
          NEXT_PUBLIC_BLOCKXONE_RUNTIME_SCOPE: ${{ matrix.target }}
          VERCEL_ENV: ${{ matrix.target == 'TESTNET' && 'preview' || 'production' }}
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          BLOCKXONE_WEB_SURFACE: public
          NEXT_PUBLIC_BLOCKXONE_WEB_SURFACE: public
          NEXT_PUBLIC_DEMO_REQUEST_ENABLED: 'false'
        run: |
          set -euo pipefail
          node node_modules/typescript/bin/tsc --noEmit --incremental false
          npm run build

      - name: Typecheck the exact Supabase Edge verification package
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/bx1-deno" --no-audit --no-fund --save-exact deno@2.9.6
          cp apps/web/src/lib/portal/funding-claim.ts supabase/functions/bx1-funding-verifier/funding-claim.ts
          cp apps/web/src/lib/portal/funding-verifier.ts supabase/functions/bx1-funding-verifier/funding-verifier.ts
          cmp apps/web/src/lib/portal/funding-claim.ts supabase/functions/bx1-funding-verifier/funding-claim.ts
          cmp apps/web/src/lib/portal/funding-verifier.ts supabase/functions/bx1-funding-verifier/funding-verifier.ts
          cd supabase/functions/bx1-funding-verifier
          "$RUNNER_TEMP/bx1-deno/node_modules/.bin/deno" check --config deno.json index.ts funding-verifier.ts funding-claim.ts

  funding-sql-acceptance:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'registration-browser-proof' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bx1_demo_ci
          POSTGRES_USER: bx1_ci_bootstrap
          POSTGRES_PASSWORD: bx1-synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bx1_ci_bootstrap -d bx1_demo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out exact funding source into an independent cloud fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Select pinned Node for funding SQL proof
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          check-latest: false
          package-manager-cache: false
      - name: Install locked dependencies for the disposable cloud SQL runner
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.8 --no-audit --no-fund
          test "$(node --version)" = 'v22.23.1'
          test "$(npm --version)" = '10.9.8'
          npm ci --no-audit --no-fund
      - name: Prepare non-bootstrap postgres for hosted-role permission proof
        shell: bash
        env:
          BX1_FIXTURE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$BX1_FIXTURE_CONTAINER" psql -U bx1_ci_bootstrap -d bx1_demo_ci -v ON_ERROR_STOP=1 -c "CREATE ROLE postgres WITH LOGIN SUPERUSER CREATEDB CREATEROLE BYPASSRLS PASSWORD 'bx1-synthetic-ci-only'; ALTER DATABASE bx1_demo_ci OWNER TO postgres;"
      - name: Verify canonical funding and reconciliation in fresh cloud PostgreSQL
        shell: bash
        env:
          BX1_FUNDING_SQL_TEST_URL: postgresql://postgres:bx1-synthetic-ci-only@127.0.0.1:5432/bx1_demo_ci
        run: node apps/web/scripts/test-portal-funding.mjs

  entry-sql-acceptance:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'registration-browser-proof' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bx1_demo_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: bx1-synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bx1_demo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out exact entry source in isolated cloud fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Select pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          check-latest: false
          package-manager-cache: false
      - name: Install locked dependencies in cloud
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Prove additive mappings and authoritative entry commands
        env:
          BX1_PORTAL_SQL_TEST_URL: postgresql://postgres:bx1-synthetic-ci-only@127.0.0.1:5432/bx1_demo_ci
        run: node apps/web/scripts/test-entry.mjs

  application-admission-sql-acceptance:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'registration-browser-proof' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bx1_demo_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: bx1-synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bx1_demo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out exact application handoff source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Select pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          check-latest: false
          package-manager-cache: false
      - name: Install locked dependencies in cloud
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Prove persona data, independent review and admission boundaries
        env:
          BX1_PORTAL_SQL_TEST_URL: postgresql://postgres:bx1-synthetic-ci-only@127.0.0.1:5432/bx1_demo_ci
        run: node apps/web/scripts/test-application-admission.mjs

  entry-mainnet-sql-acceptance:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'registration-browser-proof' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bx1_demo_ci
          POSTGRES_USER: bx1_ci_bootstrap
          POSTGRES_PASSWORD: bx1-synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bx1_ci_bootstrap -d bx1_demo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out exact MAIN entry baseline into an independent cloud fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Select pinned Node for MAIN baseline proof
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          check-latest: false
          package-manager-cache: false
      - name: Install locked dependencies in the disposable cloud runner
        working-directory: apps/web
        shell: bash
        run: npm ci --no-audit --no-fund
      - name: Prepare non-bootstrap postgres for hosted-role permission proof
        shell: bash
        env:
          BX1_FIXTURE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$BX1_FIXTURE_CONTAINER" psql -U bx1_ci_bootstrap -d bx1_demo_ci -v ON_ERROR_STOP=1 -c "CREATE ROLE postgres WITH LOGIN SUPERUSER CREATEDB CREATEROLE BYPASSRLS PASSWORD 'bx1-synthetic-ci-only'; ALTER DATABASE bx1_demo_ci OWNER TO postgres;"
      - name: Prove empty MAIN admission and preservation as a hosted-like non-superuser
        env:
          BX1_PORTAL_SQL_TEST_URL: postgresql://postgres:bx1-synthetic-ci-only@127.0.0.1:5432/bx1_demo_ci
        run: node apps/web/scripts/test-entry-mainnet.mjs

  amoy-provider-readiness:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'registration-browser-proof' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out exact source for read-only provider probe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Select pinned Node for read-only probe
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          check-latest: false
          package-manager-cache: false
      - name: Observe Amoy chain and finalized-tag availability without signing
        run: node apps/web/scripts/probe-amoy-funding.mjs

  registration-browser-proof:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'registration-browser-proof' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact proof source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Select pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          check-latest: false
          package-manager-cache: false

      - name: Install pinned browser tooling only in the ephemeral cloud runner
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/bx1-registration-browsers
        run: |
          set -euo pipefail
          npm install --global npm@10.9.8 --no-audit --no-fund
          test "$(node --version)" = 'v22.23.1'
          test "$(npm --version)" = '10.9.8'
          npm install --prefix "$RUNNER_TEMP/bx1-registration-playwright" --ignore-scripts --no-audit --no-fund --save-exact playwright@1.63.0
          node "$RUNNER_TEMP/bx1-registration-playwright/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Observe native browser Origin with an empty invalid registration body
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/bx1-registration-browsers
          BX1_REGISTRATION_BROWSER_EXPECTATION: ${{ inputs.registration_origin_expectation }}
        run: node apps/web/scripts/test-registration-browser.mjs
