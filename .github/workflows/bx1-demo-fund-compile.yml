name: BX1 platform cloud acceptance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Cloud acceptance, empty-form browser proof, or focused UI and password-recovery checks
        type: choice
        options: [acceptance, registration-browser-proof, fund-dashboard-focused, theme-focused, auth-recovery-focused, connected-session-focused, document-read-recovery-focused, fund-signer-entry-focused, connected-fund-providers-focused, official-scanner-focused, offering-signatures-api-focused, offering-scanner-operating, offering-scanner-source-focused, provider-diagnostics-focused, document-result-recovery-focused]
        default: acceptance
      scanner_scope:
        description: Queue for one protected manual scanner invocation only
        type: choice
        options: [OFFERING, ADMISSION]
        default: OFFERING
      scanner_operation:
        description: CLAIM processes one job; RECOVER resumes one already-recorded ADMISSION result without a new scan
        type: choice
        options: [CLAIM, RECOVER]
        default: CLAIM
      registration_origin_expectation:
        description: Expected browser-generated Origin on the current hosted TEST document
        type: choice
        options: [null-origin, canonical-origin]
        default: canonical-origin
  push:
    paths:
      - apps/web/src/middleware*
