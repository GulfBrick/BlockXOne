name: BX1 hosted review

on:
  push:
    branches:
      - codex/hosted-administration-20260919
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: bx1-hosted-review-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  source-regression-build:
    name: Source regression and synthetic build
    if: >-
      github.repository == 'GulfBrick/BlockXOne' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/codex/hosted-administration-20260919') ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'codex/hosted-administration-20260919'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: apps/web
    steps:
      - name: Check out the exact review commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Verify checkout identity
        timeout-minutes: 1
        env:
          EXPECTED_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" EXPECTED_COMMIT="$EXPECTED_COMMIT" \
            bash --noprofile --norc -euo pipefail <<'BX1_CHECK'
          actual_commit="$(git rev-parse HEAD)"
          test "$actual_commit" = "$EXPECTED_COMMIT"
          printf 'BX1_REVIEW_COMMIT=%s\n' "$actual_commit"
          BX1_CHECK

      - name: Select the pinned project Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 5
        with:
          node-version: '22.23.1'
          check-latest: false
          package-manager-cache: false

      - name: Install pinned npm and locked dependencies
        timeout-minutes: 5
        run: |
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" CI=true TZ=UTC NEXT_TELEMETRY_DISABLED=1 \
            bash --noprofile --norc -euo pipefail <<'BX1_CHECK'
          npm install --global npm@10.9.8 --no-audit --no-fund
          test "$(node --version)" = 'v22.23.1'
          test "$(npm --version)" = '10.9.8'
          node --version
          npm --version
          npm ci --no-audit --no-fund
          BX1_CHECK

      - name: Native configuration and copy preflight
        timeout-minutes: 2
        run: |
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" CI=true TZ=UTC NEXT_TELEMETRY_DISABLED=1 \
            BLOCKXONE_AUTH_MODE=supabase NEXT_PUBLIC_BLOCKXONE_AUTH_MODE=supabase \
            SUPABASE_URL=https://supabase.blockxone.invalid \
            SUPABASE_PUBLISHABLE_KEY=sb_publishable_00000000000000000000000000000000 \
            BLOCKXONE_APP_ORIGIN=https://app.blockxone.invalid \
            SERVER_ACTION_ALLOWED_ORIGINS=app.blockxone.invalid \
            BLOCKXONE_WEB_SURFACE=public NEXT_PUBLIC_BLOCKXONE_WEB_SURFACE=public \
            NEXT_PUBLIC_DEMO_REQUEST_ENABLED=false \
            bash --noprofile --norc -euo pipefail <<'BX1_CHECK'
          npm run preflight
          BX1_CHECK

      - name: Preflight dependency configuration and runner tests
        timeout-minutes: 3
        run: |
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" CI=true TZ=UTC NEXT_TELEMETRY_DISABLED=1 \
            bash --noprofile --norc -euo pipefail <<'BX1_CHECK'
          node --test \
            scripts/preflight.node-test.mjs \
            scripts/dependency-compat.node-test.mjs \
            scripts/production-url-policy.node-test.mjs \
            scripts/production-runtime-contract.node-test.mjs \
            scripts/run-hermetic-tests.node-test.mjs
          BX1_CHECK

      - name: Complete hermetic application suite
        timeout-minutes: 5
        run: |
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" CI=true TZ=UTC NEXT_TELEMETRY_DISABLED=1 \
            bash --noprofile --norc -euo pipefail <<'BX1_CHECK'
          npm test
          BX1_CHECK

      - name: Nonincremental TypeScript check
        timeout-minutes: 3
        run: |
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" CI=true TZ=UTC NEXT_TELEMETRY_DISABLED=1 \
            bash --noprofile --norc -euo pipefail <<'BX1_CHECK'
          node node_modules/typescript/bin/tsc --noEmit --incremental false
          BX1_CHECK

      - name: Serial identity SQL regression
        timeout-minutes: 3
        run: |
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" CI=true TZ=UTC NEXT_TELEMETRY_DISABLED=1 \
            bash --noprofile --norc -euo pipefail <<'BX1_CHECK'
          node scripts/test-supabase-identity.mjs
          BX1_CHECK

      - name: Serial wallet SQL regression
        timeout-minutes: 3
        run: |
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" CI=true TZ=UTC NEXT_TELEMETRY_DISABLED=1 \
            bash --noprofile --norc -euo pipefail <<'BX1_CHECK'
          node scripts/test-supabase-wallet-ownership.mjs
          BX1_CHECK

      - name: Serial MFA SQL regression
        timeout-minutes: 3
        run: |
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" CI=true TZ=UTC NEXT_TELEMETRY_DISABLED=1 \
            bash --noprofile --norc -euo pipefail <<'BX1_CHECK'
          node scripts/test-supabase-mfa.mjs
          BX1_CHECK

      - name: Serial administration and four-migration upgrade regression
        timeout-minutes: 5
        run: |
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" CI=true TZ=UTC NEXT_TELEMETRY_DISABLED=1 \
            bash --noprofile --norc -euo pipefail <<'BX1_CHECK'
          node scripts/test-supabase-administration.mjs
          BX1_CHECK

      - name: Build with nonfunctional synthetic Supabase configuration
        timeout-minutes: 10
        run: |
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" CI=true TZ=UTC NEXT_TELEMETRY_DISABLED=1 \
            NODE_ENV=production \
            BLOCKXONE_AUTH_MODE=supabase NEXT_PUBLIC_BLOCKXONE_AUTH_MODE=supabase \
            SUPABASE_URL=https://supabase.blockxone.invalid \
            SUPABASE_PUBLISHABLE_KEY=sb_publishable_00000000000000000000000000000000 \
            BLOCKXONE_APP_ORIGIN=https://app.blockxone.invalid \
            SERVER_ACTION_ALLOWED_ORIGINS=app.blockxone.invalid \
            BLOCKXONE_WEB_SURFACE=public NEXT_PUBLIC_BLOCKXONE_WEB_SURFACE=public \
            NEXT_PUBLIC_DEMO_REQUEST_ENABLED=false \
            bash --noprofile --norc -euo pipefail <<'BX1_CHECK'
          npm run build
          BX1_CHECK

      - name: Probe built route containment on the GitHub cloud runner
        timeout-minutes: 3
        run: |
          env -i PATH="$PATH" HOME="$HOME" TMPDIR="$RUNNER_TEMP" CI=true TZ=UTC NEXT_TELEMETRY_DISABLED=1 \
            NODE_ENV=production \
            BLOCKXONE_AUTH_MODE=supabase NEXT_PUBLIC_BLOCKXONE_AUTH_MODE=supabase \
            SUPABASE_URL=https://supabase.blockxone.invalid \
            SUPABASE_PUBLISHABLE_KEY=sb_publishable_00000000000000000000000000000000 \
            BLOCKXONE_APP_ORIGIN=https://app.blockxone.invalid \
            SERVER_ACTION_ALLOWED_ORIGINS=app.blockxone.invalid \
            BLOCKXONE_WEB_SURFACE=public NEXT_PUBLIC_BLOCKXONE_WEB_SURFACE=public \
            NEXT_PUBLIC_DEMO_REQUEST_ENABLED=false \
            bash --noprofile --norc -euo pipefail <<'BX1_CHECK'
          npm run test:production-containment
          printf '%s\n' 'BX1_HOSTED_REVIEW_PASS scope=source-checks-serial-synthetic-SQL-build-built-route-containment GoTrue=not-proven concurrency=not-proven deployment=not-performed'
          BX1_CHECK
